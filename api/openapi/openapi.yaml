openapi: 3.0.3
info:
  title: Office Go React Starter API
  version: 0.1.0
  description: |
    Starter API. Task endpoints are DEMO ONLY and must not be enabled in production
    before implementing real authentication, authorization and audit logging.
servers:
  - url: /api/v1
paths:
  /tasks:
    get:
      operationId: listTasks
      summary: List demo tasks
      responses:
        '200':
          description: Tasks
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskListResponse'
    post:
      operationId: createTask
      summary: Create demo task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '422': { $ref: '#/components/responses/InvalidInput' }
  /tasks/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64, minimum: 1 }
    patch:
      operationId: updateTask
      summary: Set demo task completion status
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTaskInput'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: deleteTask
      summary: Delete demo task
      responses:
        '204': { description: Deleted }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  schemas:
    Task:
      type: object
      required: [id, title, completed, created_at]
      properties:
        id: { type: integer, format: int64 }
        title: { type: string, minLength: 1, maxLength: 200 }
        completed: { type: boolean }
        created_at: { type: string, format: date-time }
    CreateTaskInput:
      type: object
      required: [title]
      additionalProperties: false
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
    UpdateTaskInput:
      type: object
      required: [completed]
      additionalProperties: false
      properties:
        completed: { type: boolean }
    TaskResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/Task' }
    TaskListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Task' }
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    InvalidInput:
      description: Invalid input
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
